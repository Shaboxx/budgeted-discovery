name: Reproduce portable experiments
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
      - run: python scripts/verify_historical.py
      - run: python scripts/demo.py --output runs/ci-demo
      - run: python scripts/analyze_main_grid.py --aggregate data/historical --output runs/historical-analysis
